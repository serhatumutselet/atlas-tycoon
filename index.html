<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Atlas Tycoon</title>
  <meta name="description" content="Buy cities, raise landmarks and chase a monopoly on a floating island. Play on one device or online with friends.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Outfit:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="sky" aria-hidden="true"></div>

  <!-- Home -->
  <section id="home" class="screen">
    <div class="panel home-panel">
      <div class="lang" role="group" data-i18n-label="language">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="tr">TR</button>
      </div>
      <h1 class="logo">Atlas<br>Tycoon</h1>
      <p class="lede" data-i18n="tagline"></p>
      <label class="field"><span data-i18n="yourName"></span>
        <input id="myName" maxlength="14" autocomplete="nickname" data-i18n-ph="namePlaceholder">
      </label>
      <div class="stack">
        <button id="goOnline" class="btn primary big" type="button" data-i18n="createRoom"></button>
        <form id="joinForm" class="join">
          <input id="joinCode" maxlength="5" data-i18n-ph="roomCode" data-i18n-label="roomCode" autocapitalize="characters">
          <button class="btn big" type="submit" data-i18n="join"></button>
        </form>
        <button id="goLocal" class="btn ghost" type="button" data-i18n="playLocal"></button>
      </div>
      <p id="homeError" class="error" role="alert"></p>
      <details class="rules">
        <summary data-i18n="howToPlay"></summary>
        <ul id="rulesList"></ul>
      </details>
    </div>
  </section>

  <!-- Local setup -->
  <section id="local" class="screen" hidden>
    <div class="panel">
      <button class="back" type="button" data-go="home" data-i18n="back"></button>
      <h2 data-i18n="localTitle"></h2>
      <p class="lede" data-i18n="localLede"></p>
      <div id="seats" class="seats"></div>
      <label class="field row"><span data-i18n="roundLimit"></span>
        <select id="maxRounds"><option>20</option><option selected>30</option><option>40</option><option value="999" data-i18n="none"></option></select>
      </label>
      <button id="startLocal" class="btn primary big" type="button" data-i18n="startGame"></button>
    </div>
  </section>

  <!-- Online lobby -->
  <section id="lobby" class="screen" hidden>
    <div class="panel">
      <button class="back" type="button" id="leaveLobby" data-i18n="leaveRoom"></button>
      <p class="eyebrow" data-i18n="roomCodeLabel"></p>
      <div class="code-row">
        <span id="roomCode" class="room-code"></span>
        <button id="copyLink" class="btn" type="button" data-i18n="copyLink"></button>
      </div>
      <ul id="lobbySeats" class="lobby-seats"></ul>
      <div id="hostControls" class="host">
        <div class="row-btns">
          <button id="addBot" class="btn" type="button" data-i18n="addBot"></button>
          <button id="removeBot" class="btn" type="button" data-i18n="removeBot"></button>
        </div>
        <label class="field row"><span data-i18n="roundLimit"></span>
          <select id="roomRounds"><option>20</option><option selected>30</option><option>40</option><option value="999" data-i18n="none"></option></select>
        </label>
        <button id="startOnline" class="btn primary big" type="button" data-i18n="startGame"></button>
      </div>
      <p id="guestNote" class="lede" hidden data-i18n="waitHost"></p>
      <p id="lobbyError" class="error" role="alert"></p>
    </div>
  </section>

  <!-- Game -->
  <section id="game" class="game" hidden>
    <canvas id="board" data-pad-top="64" data-pad-bottom="96" aria-label="Game board"></canvas>
    <header class="hud-top">
      <div id="chips" class="chips"></div>
      <div class="hud-tools">
        <span id="round" class="round"></span>
        <button id="journalBtn" class="icon-btn" type="button" data-i18n-label="journal" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3zM8 9h8M8 13h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button id="menuBtn" class="icon-btn" type="button" data-i18n-label="menu" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>
    <div id="ticker" class="ticker" aria-live="polite"></div>
    <div id="menu" class="menu" hidden>
      <div class="lang" role="group" data-i18n-label="language">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="tr">TR</button>
      </div>
      <label class="field row" id="speedRow"><span data-i18n="botSpeed"></span>
        <select id="speed"><option value="1.5" data-i18n="slow"></option><option value="1" selected data-i18n="normal"></option><option value="0.45" data-i18n="fast"></option><option value="0.08" data-i18n="turbo"></option></select>
      </label>
      <button id="quitBtn" class="btn" type="button" data-i18n="leaveGame"></button>
    </div>
    <aside id="journal" class="journal" hidden>
      <h3 data-i18n="journal"></h3>
      <ol id="log"></ol>
    </aside>
    <div id="info" class="info" hidden></div>
    <!-- Bottom status strip: whose turn / who we are waiting for / tap-a-tile instructions -->
    <div id="action" class="action empty" aria-live="polite"></div>
    <!-- Centre stage: decisions, dice, cards, turn banner -->
    <div id="stage" class="stage" hidden>
      <div id="decide" class="decide" role="dialog" aria-modal="false" aria-live="polite"></div>
    </div>
    <div id="diceShow" class="dice-show" hidden aria-hidden="true">
      <div class="dice-pair"><div class="cube"></div><div class="cube"></div></div>
      <div class="dice-total"></div>
    </div>
    <div id="turnBanner" class="turn-banner" hidden></div>
    <div id="cardShow" class="card-show" hidden></div>
  </section>

  <div id="over" class="overlay" hidden>
    <div class="panel over-panel">
      <p class="eyebrow" id="overReason"></p>
      <h2 id="overTitle"></h2>
      <ol id="standings" class="standings"></ol>
      <button id="overBtn" class="btn primary big" type="button" data-i18n="backToMenu"></button>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/render.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
